name: Build Keyball44 Vial Firmware

on:
  push:
    branches:
      - main
      - vial-layout-update
  pull_request:
    paths:
      - 'qmk_firmware/keyboards/keyball/keyball44/keymaps/vial/**'
      - 'qmk_firmware/keyboards/keyball/keyball44/keymaps/vial.*'
      - 'AGENTS.md'
      - '.github/workflows/build-vial.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup QMK environment
        uses: qmk/qmk_setup@v1
        with:
          qmk_repo: ${{ github.workspace }}/qmk_firmware
          skip_install: false

      - name: Prepare build tree
        run: |
          git clone --depth=1 https://github.com/qmk/qmk_firmware.git .qmk_work
          rsync -a qmk_firmware/keyboards/keyball/keyball44/keymaps/vial/ .qmk_work/keyboards/keyball/keyball44/keymaps/vial/
          rsync -a qmk_firmware/keyboards/keyball/keyball44/keymap.c .qmk_work/keyboards/keyball/keyball44/
          rsync -a qmk_firmware/keyboards/keyball/keyball44/config.h .qmk_work/keyboards/keyball/keyball44/

      - name: Build Keyball44 Vial firmware
        run: |
          cd .qmk_work
          make keyball/keyball44:vial

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyball44-vial-uf2
          path: .qmk_work/.build/keyball_keyball44_vial.uf2
