name: Build Keyball44 Vial Firmware

on:
  push:
    branches:
      - main
      - vial-layout-update
  pull_request:
    paths:
      - 'qmk_firmware/keyboards/keyball/keyball44/**'
      - 'AGENTS.md'
      - '.github/workflows/build-vial.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare build tree
        run: |
          git clone --depth=1 https://github.com/qmk/qmk_firmware.git .qmk_work
          rsync -a qmk_firmware/keyboards/keyball/ .qmk_work/keyboards/keyball/

      - name: Install QMK dependencies
        run: |
          cd .qmk_work
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Keyball44 Vial firmware
        run: |
          cd .qmk_work
          make keyball/keyball44:vial

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyball44-vial-uf2
          path: .qmk_work/.build/keyball_keyball44_vial.uf2
