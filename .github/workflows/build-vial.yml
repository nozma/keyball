name: Build Keyball44 Vial Firmware

on:
  push:
    branches:
      - main
      - workflow-artifact-fix
  pull_request:
    paths:
      - 'qmk_firmware/keyboards/keyball/keyball44/**'
      - 'AGENTS.md'
      - '.github/workflows/build-vial.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build toolchain and QMK CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
          python3 -m pip install --user --upgrade pip qmk
          echo "$(python3 -m site --user-base)/bin" >> $GITHUB_PATH
          export PATH="$(python3 -m site --user-base)/bin:$PATH"
          qmk --version

      - name: Setup QMK workspace
        run: |
          qmk setup -H "$GITHUB_WORKSPACE/.qmk_work" --branch master --yes
          python3 -m pip install --user -r "$GITHUB_WORKSPACE/.qmk_work/requirements.txt"

      - name: Overlay Keyball sources
        run: |
          rsync -a qmk_firmware/keyboards/keyball/ .qmk_work/keyboards/keyball/

      - name: Build Keyball44 Vial firmware
        run: |
          cd .qmk_work
          make SKIP_GIT=yes keyball/keyball44:vial

      - name: Locate firmware artifact
        id: locate
        run: |
          UF2_PATH=$(find .qmk_work -maxdepth 6 -type f -name 'keyball_keyball44_vial.uf2' -print -quit)
          if [ -z "$UF2_PATH" ]; then
            echo "Failed to locate UF2 artifact" >&2
            find .qmk_work -maxdepth 6 -type f -name '*.uf2' -print
            exit 1
          fi
          echo "UF2_PATH=$UF2_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyball44-vial-uf2
          path: ${{ steps.locate.outputs.UF2_PATH }}
          if-no-files-found: error
