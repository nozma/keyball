name: Build Keyball44 Vial Firmware

on:
  push:
    branches:
      - main
      - workflow-artifact-fix
  pull_request:
    paths:
      - 'qmk_firmware/keyboards/keyball/keyball44/**'
      - 'AGENTS.md'
      - '.github/workflows/build-vial.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QMK_HOME: ${{ github.workspace }}/.qmk_work

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
          python -m pip install --upgrade pip
          python -m pip install qmk

      - name: Prepare QMK workspace
        run: |
          git clone --depth=1 https://github.com/qmk/qmk_firmware.git .qmk_work
          rsync -a qmk_firmware/keyboards/keyball/ .qmk_work/keyboards/keyball/
          python -m pip install -r .qmk_work/requirements.txt

      - name: Build Keyball44 Vial firmware
        run: |
          cd .qmk_work
          make keyball/keyball44:vial

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyball44-vial-uf2
          path: .qmk_work/.build/keyball_keyball44_vial.uf2
          if-no-files-found: error
