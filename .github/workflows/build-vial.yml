name: Build Keyball44 Vial Firmware

on:
  push:
    branches:
      - main
      - workflow-artifact-fix
  pull_request:
    paths:
      - 'qmk_firmware/keyboards/keyball/keyball44/**'
      - 'AGENTS.md'
      - '.github/workflows/build-vial.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QMK_HOME: ${{ github.workspace }}/qmk_firmware

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
          python -m pip install --upgrade pip
          python -m pip install -r qmk_firmware/requirements.txt

      - name: Build Keyball44 Vial firmware
        run: |
          make -C qmk_firmware keyball/keyball44:vial

      - name: Collect artifact
        run: |
          mkdir -p artifacts
          cp qmk_firmware/.build/keyball_keyball44_vial.uf2 artifacts/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyball44-vial-uf2
          path: artifacts/keyball_keyball44_vial.uf2
          if-no-files-found: error
